# Module 6 — AI Application Security Lab
#
# Services:
#   ollama          — local LLM server (CPU mode, no GPU required)
#   vulnerable-app  — intentionally insecure Flask LLM app (port 5001)
#
# Full mode (Ollama + real LLM):
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:1b   # one-time, ~1.3 GB
#   curl http://localhost:5001/
#
# Mock mode (no LLM, no download — instant responses):
#   MOCK_MODE=true docker compose up -d
#   curl http://localhost:5001/
#
# crAPI chatbot (optional — requires OpenAI API key):
#   Uncomment the crapi-chatbot service below and set CHATBOT_OPENAI_API_KEY

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # Healthcheck uses the ollama binary directly — curl may not be in image
    # start_period gives Ollama time to fully initialize before checks begin
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G

  vulnerable-app:
    build: ./vulnerable-llm-app
    container_name: vulnerable-llm-app
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      - OLLAMA_BASE=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
      - MOCK_MODE=${MOCK_MODE:-false}
    # service_started (not service_healthy) — the Flask app handles Ollama
    # being unavailable gracefully by falling back to mock responses.
    # This also means MOCK_MODE=true works without waiting for Ollama health.
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── Optional: crAPI chatbot (requires OpenAI API key) ──────────────────────
  # Uncomment to use crAPI's built-in chatbot as an additional attack target.
  # Requires CHATBOT_OPENAI_API_KEY to be set in environment or .env file.
  #
  # crapi-chatbot:
  #   image: crapi/crapi-chatbot:latest
  #   container_name: crapi-chatbot-m6
  #   ports:
  #     - "127.0.0.1:5002:5002"
  #   environment:
  #     - CHATBOT_OPENAI_API_KEY=${CHATBOT_OPENAI_API_KEY}
  #     - DEFAULT_MODEL=gpt-4o-mini
  #     - SERVER_PORT=5002

volumes:
  ollama-data:
