# ============================================================
# DevSecOps CI/CD Pipeline — GitHub Actions
# Repo: https://github.com/akhil65/DSO
#
# Jobs:
#   [Module 1]  ✅ docker-validate     — YAML syntax check
#   [Module 1]  ✅ ossf-scorecard      — repo security posture score
#   [Module 2]  ✅ sast-bandit         — Python SAST
#   [Module 2]  ✅ sast-semgrep        — multi-language SAST
#   [Module 2]  ✅ sca-trivy           — dependency + container CVE scan
#   [Module 2]  ✅ sca-osv             — Google OSV dependency scan
#   [Module 5]  ✅ secrets-gitleaks    — secrets detection across full git history
#   [Module 5]  ✅ sast-codeql         — GitHub native SAST (JS/Python)
#   [Module 5]  ✅ sast-sonarcloud     — SonarCloud SAST + code quality gate
#   [Module 5]  ✅ iac-checkov         — Dockerfile + docker-compose IaC scan
#   [Module 5]  ✅ lint-hadolint       — Dockerfile best-practice linting
#   [Module 5]  ✅ dast-zap            — OWASP ZAP baseline (workflow_dispatch only)
# ============================================================

name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ----------------------------------------------------------
  # MODULE 1 — Validate Docker Compose syntax
  # ----------------------------------------------------------
  docker-validate:
    name: "M1 · Validate Docker Compose"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose \
            -f devsecops-lab/module-1-infrastructure/docker-compose.yml \
            config --quiet
          echo "✅ docker-compose.yml is valid"

  # ----------------------------------------------------------
  # MODULE 1 — OSSF Scorecard
  # Scores the repo security posture across 18 checks
  # Results appear in GitHub Security tab
  # ----------------------------------------------------------
  ossf-scorecard:
    name: "M1 · OSSF Scorecard"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif
          category: ossf-scorecard

  # ----------------------------------------------------------
  # MODULE 2 — SAST: Bandit (Python)
  # ----------------------------------------------------------
  sast-bandit:
    name: "M2 · SAST — Bandit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r devsecops-lab/module-2-sast/sample-vulnerable-app/ \
                -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ----------------------------------------------------------
  # MODULE 2 — SAST: Semgrep
  # r2c/returntocorp rebranded to semgrep — action moved to semgrep/semgrep-action
  # ----------------------------------------------------------
  sast-semgrep:
    name: "M2 · SAST — Semgrep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config=p/owasp-top-ten --config=p/python \
                  devsecops-lab/ --sarif --output=semgrep-results.sarif || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-results.sarif

  # ----------------------------------------------------------
  # MODULE 2 — SCA: Trivy
  # ----------------------------------------------------------
  sca-trivy:
    name: "M2 · SCA — Trivy"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on requirements.txt
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: devsecops-lab/module-2-sast/sample-vulnerable-app/
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ----------------------------------------------------------
  # MODULE 2 — SCA: OSV Scanner (Google)
  # Using direct CLI install — action tags are unreliable across versions
  # ----------------------------------------------------------
  sca-osv:
    name: "M2 · SCA — OSV Scanner"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OSV Scanner
        run: |
          curl -fsSL \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
      - name: Run OSV Scanner
        run: |
          osv-scanner --lockfile \
            devsecops-lab/module-2-sast/sample-vulnerable-app/requirements.txt \
            || true

  # ----------------------------------------------------------
  # MODULE 5 — Secrets Detection: Gitleaks
  # Scans full git history for leaked API keys, tokens, passwords
  # fetch-depth: 0 is essential — scans all commits, not just HEAD
  # ----------------------------------------------------------
  secrets-gitleaks:
    name: "M5 · Secrets — Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------
  # MODULE 5 — SAST: CodeQL (GitHub native)
  # Scans JavaScript and Python for security vulnerabilities
  # Results appear in GitHub Security → Code scanning alerts
  # Free for public repositories — no token required
  # ----------------------------------------------------------
  sast-codeql:
    name: "M5 · SAST — CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}

  # ----------------------------------------------------------
  # MODULE 5 — SAST + Quality Gate: SonarCloud
  # Scans for bugs, vulnerabilities, code smells, and coverage
  # Requires: SONAR_TOKEN secret in repo settings
  # Organization: akhil65   Project: akhil65_DSO
  # Dashboard: https://sonarcloud.io/project/overview?id=akhil65_DSO
  # ----------------------------------------------------------
  sast-sonarcloud:
    name: "M5 · SAST — SonarCloud"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for blame data)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=akhil65
            -Dsonar.projectKey=akhil65_DSO
            -Dsonar.sources=devsecops-lab
            -Dsonar.exclusions=**/node_modules/**,**/*.min.js,**/docs/**
            -Dsonar.python.version=3
            -Dsonar.qualitygate.wait=false

  # ----------------------------------------------------------
  # MODULE 5 — IaC Security: Checkov
  # Scans Dockerfiles and docker-compose.yml for misconfigurations
  # Checks against CIS benchmarks and Checkov security policies
  # ----------------------------------------------------------
  iac-checkov:
    name: "M5 · IaC — Checkov"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: devsecops-lab
          framework: dockerfile,docker_compose
          output_format: sarif
          output_file_path: console,${{ github.workspace }}/checkov-results.sarif

      - name: Upload Checkov results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ github.workspace }}/checkov-results.sarif
          category: checkov

  # ----------------------------------------------------------
  # MODULE 5 — Dockerfile Linting: Hadolint
  # Enforces Dockerfile best practices:
  #   - pinned base image tags (not :latest)
  #   - COPY preferred over ADD
  #   - no sudo, no apt-get without --no-install-recommends
  #   - shell quoting, pipefail set
  # ----------------------------------------------------------
  lint-hadolint:
    name: "M5 · Lint — Hadolint (Dockerfile)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hadolint
        run: |
          curl -fsSL \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Run Hadolint on all Dockerfiles
        run: |
          find devsecops-lab -name "Dockerfile*" | while read f; do
            echo "=== $f ==="
            hadolint --failure-threshold error "$f" || true
          done

  # ----------------------------------------------------------
  # MODULE 5 — DAST: OWASP ZAP Baseline
  # Passive scan only — no attack payloads, safe for any target
  # Runs ONLY on workflow_dispatch (manual trigger) to avoid
  # launching a vulnerable app on every push
  # To trigger: Actions tab → DevSecOps Pipeline → Run workflow
  # ----------------------------------------------------------
  dast-zap:
    name: "M5 · DAST — ZAP Baseline"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Juice Shop
        run: |
          docker compose \
            -f devsecops-lab/module-1-infrastructure/docker-compose.yml \
            up -d juice-shop
          echo "Waiting for Juice Shop to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 -o /dev/null; then
              echo "✅ Juice Shop is up"
              break
            fi
            echo "  attempt $i/30..."
            sleep 5
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: http://localhost:3000
          artifact_name: zap-baseline-report
          fail_action: false
